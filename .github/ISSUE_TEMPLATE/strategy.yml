name: Провайдер / DPI
description: Сообщить, что обход у конкретного провайдера работает или перестал работать
title: "[Провайдер] "
labels: [network]
body:
  - type: input
    id: provider
    attributes:
      label: Провайдер
      placeholder: "Ростелеком"
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Подключение
      options:
        - Домашний интернет
        - Мобильный интернет
        - Другое
    validations:
      required: true

  - type: checkboxes
    id: services
    attributes:
      label: Где проблема?
      options:
        - label: YouTube
        - label: Discord

  - type: textarea
    id: result
    attributes:
      label: Что происходит?
      placeholder: "Не открывается / тормозит / голос не работает / после подбора заработало ..."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Версия Просвета
      placeholder: "0.1.0"
    validations:
      required: true
