name: Refresh release snapshots

on:
  push:
    branches: [release/prosvet-0.1.0]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/prosvet-0.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format source
        run: dart format lib test tool tools
      - name: Locate snapshot fonts
        shell: bash
        run: |
          font="$(fc-match -f '%{file}' 'DejaVu Sans')"
          test -f "$font"
          icons="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"
          test -f "$icons"
          echo "PROSVET_DOC_FONT=$font" >> "$GITHUB_ENV"
          echo "PROSVET_ICON_FONT=$icons" >> "$GITHUB_ENV"
      - name: Render screenshots
        run: flutter test tool/render_docs_test.dart
      - name: Commit generated changes
        shell: bash
        run: |
          git add lib test tool tools docs/off.png docs/on.png docs/settings.png
          if git diff --cached --quiet; then
            echo "Nothing to refresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh formatted snapshots"
          git push origin HEAD:release/prosvet-0.1.0
