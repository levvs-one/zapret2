name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify version, tag and changelog
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n 1)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          grep -q "^## $version$" CHANGELOG.md
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Verify lockfile is current
        run: git diff --exit-code -- pubspec.lock
      - run: dart format --output=none --set-exit-if-changed lib test tool tools
      - run: flutter analyze
      - run: flutter test
      - name: Verify winws2 arguments with zapret2 parser
        run: tools/verify-engine-args.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    needs: validate
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Fetch pinned engine
        run: ./tools/fetch-engine.ps1
        shell: pwsh
      - name: Build Windows application
        shell: pwsh
        run: flutter build windows --release --build-name="$env:VERSION" --dart-define="PROSVET_VERSION=$env:VERSION"
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:VERSION" "installer\prosvet.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test installer and uninstaller
        shell: pwsh
        run: |
          $setup = Get-Item "installer\Output\Prosvet-$env:VERSION-Setup.exe"
          $target = Join-Path $env:TEMP "ProsvetReleaseSmoke"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/NORESTART","/DIR=$target" -Wait
          if (-not (Test-Path "$target\prosvet.exe")) { throw "installed executable is missing" }
          if (-not (Test-Path "$target\engine\winws2.exe")) { throw "installed engine is missing" }
          $uninstall = Get-Item "$target\unins000.exe"
          Start-Process $uninstall.FullName -ArgumentList "/VERYSILENT","/NORESTART" -Wait
          if (Test-Path "$target\prosvet.exe") { throw "uninstall left the executable behind" }
      - name: Package release
        id: package
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/engine/winws2.exe")) { throw "engine is missing in bundle" }

          Copy-Item LICENSE,README.md,SECURITY.md,PRIVACY.md,THIRD_PARTY_NOTICES.md -Destination $bundle
          @(
            "Prosvet $env:VERSION"
            "Commit: $env:GITHUB_SHA"
            (Get-Content "$bundle/engine/VERSION" -Raw).Trim()
          ) | Set-Content "$bundle/BUILD_INFO.txt" -Encoding utf8

          $zip = "Prosvet-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path "$bundle/*" -DestinationPath $zip -CompressionLevel Optimal
          $setup = Get-Item "installer\Output\Prosvet-$env:VERSION-Setup.exe"

          @($zip, $setup.FullName) | ForEach-Object {
            $item = Get-Item $_
            $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($item.Name)"
          } | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Extract release notes
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($env:VERSION))\s*\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $m.Groups[1].Value.Trim() | Set-Content notes.md -Encoding utf8
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $zip = "Prosvet-$env:VERSION-windows-x64.zip"
          $setup = "installer\Output\Prosvet-$env:VERSION-Setup.exe"

          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0

          if ($exists) {
            gh release upload $tag $zip $setup SHA256SUMS.txt --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title "Просвет $env:VERSION" --notes-file notes.md --latest
          } else {
            gh release create $tag $zip $setup SHA256SUMS.txt --verify-tag --title "Просвет $env:VERSION" --notes-file notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
