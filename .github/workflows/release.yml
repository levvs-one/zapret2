name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Verify winws2 arguments with zapret2 itself
        run: tools/verify-engine-args.sh

  windows:
    runs-on: windows-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: ./tools/fetch-engine.ps1
        shell: pwsh
      - run: flutter build windows --release
      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          choco install innosetup --version=6.7.1 -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "installer\prosvet.iss"
      - name: Smoke-test installer and uninstaller
        shell: pwsh
        run: |
          $setup = Get-Item "installer\Output\Prosvet-*-Setup.exe"
          $target = Join-Path $env:TEMP "ProsvetReleaseSmoke"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/NORESTART","/DIR=$target" -Wait
          if (-not (Test-Path "$target\prosvet.exe")) { throw "installed executable is missing" }
          if (-not (Test-Path "$target\engine\winws2.exe")) { throw "installed engine is missing" }
          $uninstall = Get-Item "$target\unins000.exe"
          Start-Process $uninstall.FullName -ArgumentList "/VERYSILENT","/NORESTART" -Wait
          if (Test-Path "$target\prosvet.exe") { throw "uninstall left the executable behind" }
      - name: Package
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/engine/winws2.exe")) { throw "engine is missing in the bundle" }
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $bundle
          $name = "Prosvet-$($env:GITHUB_REF_NAME)-windows-x64.zip"
          Compress-Archive -Path "$bundle/*" -DestinationPath $name
          (Get-FileHash $name -Algorithm SHA256).Hash.ToLower() + "  $name" | Out-File -Encoding ascii "$name.sha256"
          $setup = Get-Item "installer\Output\Prosvet-*-Setup.exe"
          (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower() + "  $($setup.Name)" | Out-File -Encoding ascii "$($setup.FullName).sha256"
      - name: Release notes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($version))\s*\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $version" }
          $m.Groups[1].Value.Trim() | Out-File -Encoding utf8 notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Просвет ${{ github.ref_name }}
          body_path: notes.md
          files: |
            Prosvet-*-windows-x64.zip
            Prosvet-*-windows-x64.zip.sha256
            installer/Output/Prosvet-*-Setup.exe
            installer/Output/Prosvet-*-Setup.exe.sha256
