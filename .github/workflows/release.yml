name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prosvet-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid VERSION: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          $global:LASTEXITCODE = 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.release_check.outputs.exists != 'true'
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        if: steps.release_check.outputs.exists != 'true'
        run: flutter pub get

      - name: Validate
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          dart format --output=none --set-exit-if-changed lib test tool tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch verified engine
        if: steps.release_check.outputs.exists != 'true'
        run: ./tools/fetch-engine.ps1
        shell: pwsh

      - name: Build Windows application
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flutter build windows --release --build-name="$env:VERSION" --dart-define="PROSVET_VERSION=$env:VERSION"

      - name: Build installer
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:VERSION" "installer\prosvet.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test installer
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        run: |
          $setup = Get-Item "installer\Output\Prosvet-*-Setup.exe"
          $target = Join-Path $env:TEMP "ProsvetReleaseSmoke"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/NORESTART","/DIR=$target" -Wait
          if (-not (Test-Path "$target\prosvet.exe")) { throw "installed executable is missing" }
          if (-not (Test-Path "$target\engine\winws2.exe")) { throw "installed engine is missing" }
          $uninstall = Get-Item "$target\unins000.exe"
          Start-Process $uninstall.FullName -ArgumentList "/VERYSILENT","/NORESTART" -Wait
          if (Test-Path "$target\prosvet.exe") { throw "uninstall left the executable behind" }

      - name: Package release
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bundle = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$bundle/engine/winws2.exe")) { throw "engine is missing in bundle" }
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md $bundle
          $zip = "dist/Prosvet-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path "$bundle/*" -DestinationPath $zip -CompressionLevel Optimal
          $setup = Get-Item "installer\Output\Prosvet-$env:VERSION-Setup.exe"
          Copy-Item $setup.FullName "dist/$($setup.Name)"

          Get-ChildItem dist | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii

      - name: Extract release notes
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($env:VERSION))[^\r\n]*\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $m.Groups[1].Value.Trim() | Out-File -Encoding utf8 notes.md

      - name: Create GitHub release
        if: steps.release_check.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:TAG dist/* --target $env:GITHUB_SHA --title "Просвет $env:VERSION" --notes-file notes.md --latest
