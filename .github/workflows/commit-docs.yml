name: Commit UI snapshots

on:
  push:
    branches: ['agent/hardening-followup']
    paths: ['.github/workflows/commit-docs.yml']

permissions:
  contents: write

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/hardening-followup
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Locate snapshot fonts
        shell: bash
        run: |
          font="$(fc-match -f '%{file}' 'DejaVu Sans')"
          test -f "$font"
          icons="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"
          test -f "$icons"
          echo "PROSVET_DOC_FONT=$font" >> "$GITHUB_ENV"
          echo "PROSVET_ICON_FONT=$icons" >> "$GITHUB_ENV"
      - run: flutter test tool/render_docs_test.dart
      - name: Commit generated screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/off.png docs/on.png docs/settings.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh README screenshots from the real UI"
          git push origin HEAD:agent/hardening-followup
