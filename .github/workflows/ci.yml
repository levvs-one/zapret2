name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Restore dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Verify release version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          grep -q "^version: $version+" pubspec.yaml
      - run: dart format --output=none --set-exit-if-changed lib test tool tools
      - run: flutter analyze
      - run: flutter test

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify winws2 arguments with zapret2 itself
        run: tools/verify-engine-args.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: ./tools/fetch-engine.ps1
        shell: pwsh
      - name: Build Windows application
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          flutter build windows --release --build-name="$version" --dart-define="PROSVET_VERSION=$version"
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          choco install innosetup --version=6.7.1 -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "installer\prosvet.iss"
      - name: Smoke-test installer and uninstaller
        shell: pwsh
        run: |
          $setup = Get-Item "installer\Output\Prosvet-*-Setup.exe"
          $target = Join-Path $env:TEMP "ProsvetInstallSmoke"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/NORESTART","/DIR=$target" -Wait
          if (-not (Test-Path "$target\prosvet.exe")) { throw "installed executable is missing" }
          if (-not (Test-Path "$target\engine\winws2.exe")) { throw "installed engine is missing" }
          $uninstall = Get-Item "$target\unins000.exe"
          Start-Process $uninstall.FullName -ArgumentList "/VERYSILENT","/NORESTART" -Wait
          if (Test-Path "$target\prosvet.exe") { throw "uninstall left the executable behind" }
      - name: Package CI artifacts
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $bundle = "build/windows/x64/runner/Release"
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md $bundle
          Compress-Archive -Path "$bundle/*" -DestinationPath "Prosvet-$version-windows-x64.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Prosvet-windows-x64
          path: |
            Prosvet-*-windows-x64.zip
            installer/Output/Prosvet-*-Setup.exe
          if-no-files-found: error
          retention-days: 14

  ui-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Locate deterministic snapshot fonts
        shell: bash
        run: |
          font="$(fc-match -f '%{file}' 'DejaVu Sans')"
          test -f "$font"
          icons="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"
          test -f "$icons"
          echo "PROSVET_DOC_FONT=$font" >> "$GITHUB_ENV"
          echo "PROSVET_ICON_FONT=$icons" >> "$GITHUB_ENV"
      - name: Render UI reference snapshots
        run: flutter test tool/render_docs_test.dart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prosvet-ui-snapshots
          path: |
            docs/off.png
            docs/on.png
            docs/settings.png
          if-no-files-found: error
          retention-days: 14
